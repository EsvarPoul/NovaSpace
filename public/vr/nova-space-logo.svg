<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">NOVA SPACE</title>
  <desc id="desc">Dark NOVA SPACE logo with a crystal mark, VR headset, and camera.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="58%">
      <stop offset="0" stop-color="#dffff0" stop-opacity=".95"/>
      <stop offset=".2" stop-color="#74ffad" stop-opacity=".72"/>
      <stop offset=".55" stop-color="#0a7d56" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efffed"/>
      <stop offset=".26" stop-color="#82d89c"/>
      <stop offset=".54" stop-color="#0e6248"/>
      <stop offset=".78" stop-color="#04130e"/>
      <stop offset="1" stop-color="#c8ffd8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#e2ece6"/>
      <stop offset="1" stop-color="#9eb6a8"/>
    </linearGradient>
    <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="420" rx="36" fill="#010302"/>
  <circle cx="480" cy="160" r="210" fill="url(#glow)" opacity=".4"/>

  <g transform="translate(355 38)">
    <path d="M125 0 210 72 242 230 135 315 20 230 52 72Z" fill="#061811" stroke="#173f2f" stroke-width="2"/>
    <path d="M125 0 54 72 28 226 118 288 114 44Z" fill="url(#metal)" opacity=".84"/>
    <path d="M145 0 210 72 234 226 146 288 156 44Z" fill="url(#metal)" opacity=".78"/>
    <path d="M122 50 72 100 52 218 116 266Z" fill="#061711" stroke="#a7ffbd" stroke-opacity=".45" stroke-width="3"/>
    <path d="M150 50 198 100 218 218 150 266Z" fill="#061711" stroke="#a7ffbd" stroke-opacity=".45" stroke-width="3"/>
    <path d="M137 12 135 304" stroke="#e8ffe0" stroke-width="8" stroke-linecap="round"/>
    <path d="M137 104 137 282" stroke="#61ef91" stroke-width="3" stroke-linecap="round"/>
    <g filter="url(#softGlow)">
      <circle cx="137" cy="154" r="15" fill="#f5ffe9"/>
      <path d="M137 106v96M90 154h94" stroke="#ecffdf" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(92 118)" opacity=".95">
    <path d="M22 60c18-31 78-43 124-21 22 10 32 26 29 52-2 25-18 41-46 47l-75 3c-28-4-45-18-49-40-3-15 3-28 17-41Z" fill="#020706" stroke="#cefedf" stroke-width="4"/>
    <path d="M43 70c21-15 70-24 110-10 10 4 16 11 17 23-37 16-82 21-142 14 0-10 5-19 15-27Z" fill="url(#metal)" opacity=".88"/>
    <path d="M168 54c19-2 32 3 40 14" fill="none" stroke="#e0ffe7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(715 116)" opacity=".95">
    <path d="M12 38h31l14-17h60l16 18h32c17 0 29 12 29 28v66c0 16-12 28-29 28H12c-17 0-29-12-29-28V66c0-16 12-28 29-28Z" fill="#040908" stroke="#aefbd1" stroke-width="4"/>
    <circle cx="110" cy="100" r="52" fill="#030706" stroke="#c2ffe0" stroke-width="5"/>
    <circle cx="110" cy="100" r="34" fill="none" stroke="#2a7c5c" stroke-width="9"/>
    <circle cx="110" cy="100" r="9" fill="#f2ffe8" filter="url(#softGlow)"/>
    <rect x="30" y="28" width="32" height="13" rx="6.5" fill="#dcffe7"/>
  </g>

  <g transform="translate(240 274)">
    <text x="240" y="58" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="82" font-weight="900" letter-spacing="-3" fill="url(#word)">NOVA</text>
    <text x="240" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="20" fill="#b7dac4">SPACE</text>
  </g>
